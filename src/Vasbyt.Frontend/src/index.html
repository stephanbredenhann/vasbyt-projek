<!doctype html>
<html lang="af">
  <head>
    <meta charset="utf-8" />
    <title>Orania Helpmekaar Vasbyt 2027</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Orania Helpmekaar Vasbyt. Drie dae se stap, draf en fietsry in en om Orania in die Bo-Karoo. ’n Lekker avontuur, met ’n groter doel."
    />
    <meta name="theme-color" content="#2c3991" />
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="/merk/vasbyt-logo.png" />
    <link rel="preload" href="/fonts/montserrat-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/oswald-700.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Home only: start the hero photo now instead of after the JS has booted. -->
    <script>
      if (location.pathname === '/') {
        const l = Object.assign(document.createElement('link'), { rel: 'preload', as: 'image', href: '/foto/tuisblad-hero-3-flip.webp', fetchPriority: 'high' });
        document.head.appendChild(l);
      }
    </script>
  </head>
  <body>
    <!-- Painted before the JS arrives; Angular replaces it with the real header on boot. -->
    <vb-root>
      <header class="boot-header">
        <div class="container boot-header__inner">
          <img src="/merk/vasbyt-logo.svg" alt="Orania Helpmekaar Vasbyt" width="88" height="86" />
        </div>
      </header>
    </vb-root>
  </body>
</html>
