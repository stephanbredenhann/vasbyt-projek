# Local development database only — run the API itself with `dotnet run`.
#
#   docker compose up -d
#
# Bound to 127.0.0.1 so it is not reachable from your network. The production stack is a
# separate file: deploy/compose.yaml
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vasbyt
      POSTGRES_USER: vasbyt
      POSTGRES_PASSWORD: vasbyt
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vasbyt-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vasbyt -d vasbyt"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vasbyt-dev-db:
