# Production stack for the VPS. Lives beside the checkout at ~/vasbyt and is the only thing
# the deploy script touches — the stack that runs Caddy and Calibre is never modified.
#
#   docker compose -f deploy/compose.yaml up -d --build
#
# Neither service publishes a host port. Caddy reaches the API by name over stack_web; the
# database is on a private network that Caddy and Calibre have no route to.
name: vasbyt

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vasbyt
      POSTGRES_USER: vasbyt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vasbyt -d vasbyt"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-blue: &api
    build:
      context: ..
      dockerfile: Dockerfile
    image: vasbyt-api:latest
    container_name: vasbyt-api-blue
    restart: unless-stopped
    depends_on:
      db:
        # Without this the app runs its migrations against a database that is still starting
        # and crash-loops. It waits for pg_isready, not merely for the container to exist.
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Double underscore is how .NET maps environment variables onto nested config keys:
      # ConnectionStrings__Default becomes ConnectionStrings:Default.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=vasbyt;Username=vasbyt;Password=${POSTGRES_PASSWORD:?}"
      Public__BaseUrl: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__From: ${RESEND_FROM:-Vasbyt <geenantwoord@vasbyt.co.za>}
      Kwik__ApiKey: ${KWIK_API_KEY:-}
      Kwik__ApiSecret: ${KWIK_API_SECRET:-}
      # Turn the demo pay button off once Kwik is live.
      Payments__DemoEnabled: ${PAYMENTS_DEMO_ENABLED:-true}
      GoogleMaps__ApiKey: ${GOOGLE_MAPS_API_KEY:-}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      # Where POST /api/admin/uploads writes and where /media reads. Matches the volume below.
      Content__Root: /app/content-media
      DataProtection__KeysPath: /app/keys
      # Set means the public sees binnekort.html; /?voorskou=<key> unlocks the real app for the team.
      Prelaunch__Key: ${PRELAUNCH_KEY:-}
    volumes:
      # CMS images live outside the image, so `up -d --build` never takes the sponsors' logos
      # and the shop photos with it.
      - media:/app/content-media
      # Shared so blue and green read each other's login cookies.
      - dp-keys:/app/keys
    # No curl in the aspnet image. /health only answers once migrations and seeding are done.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 120s
      start_interval: 2s
    # ASP.NET drains in-flight requests on SIGTERM; give it time before the kill.
    stop_grace_period: 30s
    networks:
      - internal   # to reach the database
      - web        # so Caddy can reach this

  # Blue/green: deploy.sh starts the idle one, waits for healthy, then stops the other. Caddy routes to whichever is up.
  api-green:
    <<: *api
    build: !reset null   # same image as blue, built once
    container_name: vasbyt-api-green

networks:
  internal:
  web:
    # Created by the stack/ compose project that runs Caddy. External means compose attaches
    # to it rather than creating it, and never deletes it on `down`.
    external: true
    name: stack_web

volumes:
  db-data:
  media:
  dp-keys:
